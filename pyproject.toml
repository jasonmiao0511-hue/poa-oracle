[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poa-oracle"
version = "0.1.0"
description = "Proof-of-Antiquity attestation oracle: pay RTC to verify a machine is real physical silicon. Sidecar service + MCP tool for the RustChain agent economy."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elyan Labs", email = "scott@elyanlabs.ai" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["rustchain", "proof-of-antiquity", "hardware-attestation", "anti-sybil", "oracle", "rtc", "ai-agent", "mcp"]

[project.urls]
Homepage = "https://rustchain.org/spend.html"
Repository = "https://github.com/Scottcjn/poa-oracle"

[project.scripts]
poa-oracle = "oracle:main"

[tool.setuptools]
py-modules = ["oracle", "mcp_tool"]
